<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود | {{ request.state.app_title }}</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('madar_theme') || 'dark');</script>
</head>
<body class="login-body">
<form method="post" action="/auth/login" class="login-card">
  <div class="login-logo">
    <svg viewBox="0 0 24 24"><path fill="white" d="M21.7 3.9 18.4 20c-.25 1.1-.92 1.4-1.85.87l-5.12-3.77-2.47 2.38c-.27.27-.5.5-1.04.5l.37-5.2 9.48-8.56c.41-.36-.09-.57-.65-.2L5.48 13.44.45 11.87c-1.1-.34-1.1-1.09.23-1.62L20.2 2.6c.91-.33 1.7.21 1.5 1.3Z"/></svg>
  </div>
  <h2>{{ request.state.app_title }}</h2>
  <p class="subtitle">ورود به پنل مدیریت</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label class="field">
    <span>نام کاربری</span>
    <input name="username" required autofocus autocomplete="username">
  </label>
  <label class="field">
    <span>رمز عبور</span>
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button class="button" type="submit">{{ request.state.app_title }}</button>
  <div class="login-footer">v1.0</div>
</form>
</body>
</html>
