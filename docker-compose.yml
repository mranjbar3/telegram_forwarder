#version: "3.9"

x-common-env: &common-env
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-forwarder}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app_net]

  # ─── LLM سبک (llama.cpp) ───
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: >
      -m /models/gemma-4-E2B-it-Q3_K_M.gguf
      --host 0.0.0.0 --port 8080
      -c 2048 --threads 4 --parallel 2
    volumes:
      - ./models:/models:ro
    networks: [app_net]
    # پورت فقط داخل شبکه است؛ برای دیباگ می‌توانید expose کنید: "8080:8080"

  api:
    <<: *common-env
    build: .
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backups:/backups
    networks: [app_net]

  bot:
    <<: *common-env
    build: .
    restart: unless-stopped
    command: python -m app.bot.runner
    networks: [app_net]
    #network_mode: "host"

  # ─── Userbot (دریافت پیام از کانال‌های عمومی بدون عضویت ربات) ───
  userbot:
    <<: *common-env
    build: .
    restart: unless-stopped
    user: "0:0"                      # ← با root اجرا شود
    command: >
      sh -c "mkdir -p /app/sessions &&
             chown -R 1000:1000 /app/sessions &&
             exec python -m app.userbot.runner"
    stdin_open: true
    tty: true
    volumes:
      - ./sessions:/app/sessions
      - ./media:/app/media
    #network_mode: "host"
    networks: [app_net]

  worker:
    <<: *common-env
    build: .
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=4
    networks: [app_net]
    volumes:
      - ./media:/app/media
  beat:
    <<: *common-env
    build: .
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    networks: [app_net]

  backup:
    <<: *common-env
    build: .
    restart: unless-stopped
    command: sh /scripts/backup_loop.sh
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    networks: [app_net]

volumes:
  pg_data:
  redis_data:

networks:
  app_net:
    driver: bridge
